<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1018" />
  <meta name="description" content="BLOCKFRAY — an endless voxel arena brawler for phone and PC. Six classes, talent trees and permanent upgrades." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>BLOCKFRAY — Endless Voxel Arena</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.webmanifest" />
</head>
<body>
  <canvas id="view"></canvas>
  <canvas id="hud"></canvas>
  <div id="ui" class="hidden"></div>
  <div id="boot">
    <h1>BLOCKFRAY</h1>
    <p>Loading…</p>
  </div>
  <div id="rotate-hint">
    <div>
      <p class="big">↻</p>
      <p>Turn your phone sideways to play.</p>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
