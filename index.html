<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1018" />
  <meta name="description" content="CRAFT ARENA — an endless voxel arena brawler for phone and PC. Nine classes, talent trees and permanent upgrades." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>CRAFT ARENA — Endless Voxel Arena</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.webmanifest" />
</head>
<body>
  <canvas id="view"></canvas>
  <canvas id="hud"></canvas>
  <div id="ui" class="hidden"></div>
  <div id="boot">
    <h1>CRAFT ARENA</h1>
    <p>Loading…</p>
  </div>
  <div id="loading" class="hidden">
    <div class="load-inner">
      <h2>CRAFT ARENA</h2>
      <p id="loading-step">Carving the arena…</p>
      <div class="load-bar"><i id="loading-fill"></i></div>
    </div>
  </div>
  <!-- Landscape plays better, but this is only ever a dismissible hint: an
       overlay that blocks the screen is indistinguishable from a crash. -->
  <div id="rotate-hint" class="hidden">
    <span>↻ Turn sideways for a wider view</span>
    <button id="rotate-dismiss" aria-label="Dismiss">✕</button>
  </div>
  <button id="fullscreen-btn" title="Fullscreen" aria-label="Toggle fullscreen">⛶</button>
  <script type="module" src="src/main.js"></script>
</body>
</html>
