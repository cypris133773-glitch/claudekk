# Publishes the game to GitHub Pages. It is a static site with no build step,
# so the repository root is uploaded as-is.
#
# The workflow enables Pages itself on first run, so no manual setup is needed.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Gate the deploy on its own tests rather than trusting that CI already
      # passed — a red main should not reach players.
      - name: Logic tests
        run: npm test

      # enablement creates the Pages site on first run, so no manual
      # Settings -> Pages toggle is needed to go live.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
