# Publishes the game to GitHub Pages. It is a static site with no build step,
# so the repository root is uploaded as-is.
#
# Requires Pages to be enabled once: Settings -> Pages -> Source -> "GitHub
# Actions". See the note on the configure-pages step below for why the
# workflow cannot do that for you.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Gate the deploy on its own tests rather than trusting that CI already
      # passed — a red main should not reach players.
      - name: Logic tests
        run: npm test

      # Note: this step cannot turn Pages on by itself. configure-pages has an
      # `enablement` option, but creating a Pages site needs admin scope that
      # the default workflow token does not have, so it fails with "Resource
      # not accessible by integration". Enable Pages once by hand under
      # Settings -> Pages -> Source -> "GitHub Actions"; every deploy after
      # that is automatic.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
