<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shop All Peptides — CryptoPeptides</title>
  <meta name="description" content="Browse the full CryptoPeptides catalogue: GLP-1 and metabolic, healing, growth hormone secretagogues, longevity, blends and lab supplies. 15% off every vial." />
  <meta name="theme-color" content="#6d4aff" />
  <link rel="canonical" href="https://cryptopeptides.com/shop.html" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="CryptoPeptides" />
  <meta property="og:title" content="Shop All Peptides — CryptoPeptides" />
  <meta property="og:description" content="Browse the full CryptoPeptides catalogue: GLP-1 and metabolic, healing, growth hormone secretagogues, longevity, blends and lab supplies. 15% off every vial." />
  <meta property="og:url" content="https://cryptopeptides.com/shop.html" />
  <meta property="og:image" content="https://cryptopeptides.com/assets/img/favicon.svg" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Shop All Peptides — CryptoPeptides" />
  <meta name="twitter:description" content="Browse the full CryptoPeptides catalogue: GLP-1 and metabolic, healing, growth hormone secretagogues, longevity, blends and lab supplies. 15% off every vial." />
  <link rel="icon" href="assets/img/favicon.svg" />
  <link rel="stylesheet" href="assets/css/site.css" />
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="site-header"></div>

<main id="main" class="section-sm">
  <div class="wrap">
    <nav class="tiny muted" style="margin-bottom:12px"><a href="index.html">Home</a> / <span id="crumb">Shop</span></nav>
    <h1 id="page-title" style="margin-bottom:6px">All products</h1>
    <p class="muted" id="page-sub">Every vial is 15% below its list price — the discount is already in the price you see.</p>

    <div class="shop-layout" style="margin-top:26px">
      <aside class="filters">
        <button class="btn btn-ghost btn-block" id="filter-toggle" style="margin-bottom:12px;display:none">Filters</button>
        <div class="filters-panel" id="filters-panel">
          <div class="filter-group">
            <h4>Category</h4>
            <div id="cat-filters"></div>
          </div>
          <div class="filter-group">
            <h4>Price</h4>
            <label class="check"><input type="radio" name="price" value="all" checked /> <span>Any price</span></label>
            <label class="check"><input type="radio" name="price" value="0-50" /> <span>Under $50</span></label>
            <label class="check"><input type="radio" name="price" value="50-100" /> <span>$50 – $100</span></label>
            <label class="check"><input type="radio" name="price" value="100-200" /> <span>$100 – $200</span></label>
            <label class="check"><input type="radio" name="price" value="200-99999" /> <span>$200+</span></label>
          </div>
          <div class="filter-group">
            <h4>Tags</h4>
            <label class="check"><input type="checkbox" id="f-best" /> <span>Popular</span></label>
            <label class="check"><input type="checkbox" id="f-new" /> <span>New arrivals</span></label>
            <label class="check"><input type="checkbox" id="f-cert" /> <span>Certificate published</span><span class="n"></span></label>
            <p class="tiny muted" id="f-lots-note"></p>
          </div>
          <div class="filter-group">
            <button class="btn btn-ghost btn-block btn-sm" id="reset-filters">Reset filters</button>
          </div>
        </div>
      </aside>

      <div>
        <div class="shop-toolbar" id="search">
          <div class="field grow">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
            <input id="q" type="search" placeholder="Search compounds, e.g. tirzepatide, BPC, NAD+" aria-label="Search products" />
          </div>
          <div class="field">
            <label for="sort" class="tiny muted">Sort</label>
            <select id="sort" aria-label="Sort products">
              <option value="featured">Featured</option>
              <option value="price-asc">Price: low to high</option>
              <option value="price-desc">Price: high to low</option>
              <option value="name">Name A–Z</option>
              <option value="rating">Top rated</option>
              <option value="new">Newest</option>
            </select>
          </div>
        </div>
        <div class="result-count" id="count" style="margin-bottom:14px"></div>
        <div class="grid grid-3" id="grid"></div>
      </div>
    </div>
  </div>
</main>

<div id="site-footer"></div>
<script type="module" src="assets/js/pages/shop.js"></script>
</body>
</html>
