    .coa {
      background: #fff; color: #0f172a; border: 1px solid var(--line);

    }
    .coa-head { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; border-bottom: 2px solid #0f172a; padding-bottom: 16px; }

    .coa .pass { color: #0f9d6f; font-weight: 700; }
    .specimen-mark {
      position: absolute; inset: 0; pointer-events: none;
      display: grid; place-items: center;
    }
    .specimen-mark span {
      transform: rotate(-24deg); font-size: clamp(2rem, 7vw, 4.4rem); font-weight: 800;
      color: rgba(220, 38, 38, .13); letter-spacing: .12em; white-space: nowrap;
    }
    .specimen-banner {
      border: 1px solid rgba(220, 38, 38, .35); background: rgba(220, 38, 38, .08);
      color: #b91c1c; border-radius: 12px; padding: 14px 16px; font-size: .84rem; margin-bottom: 18px;
    }
